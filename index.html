<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>アラーム</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Nunito", -apple-system, sans-serif;
      background: linear-gradient(135deg, #fce4ec 0%, #f3e5f5 50%, #e3f2fd 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 32px;
    }

    .emoji-top {
      font-size: 48px;
      animation: bounce 2s ease-in-out infinite;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    #clock {
      font-size: 64px;
      font-weight: 800;
      color: #7c3aed;
      letter-spacing: 2px;
      font-variant-numeric: tabular-nums;
      text-shadow: 0 2px 12px rgba(124, 58, 237, 0.2);
    }

    .card {
      background: #fff;
      border-radius: 28px;
      padding: 36px 44px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      min-width: 320px;
      box-shadow: 0 8px 32px rgba(124, 58, 237, 0.12), 0 2px 8px rgba(0,0,0,0.06);
    }

    .card h2 {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #c4b5fd;
    }

    #alarm-time {
      font-size: 44px;
      font-weight: 800;
      font-family: "Nunito", sans-serif;
      background: none;
      border: none;
      border-bottom: 3px solid #e9d5ff;
      color: #6d28d9;
      text-align: center;
      width: 180px;
      padding: 8px 0;
      outline: none;
      cursor: pointer;
      transition: border-color 0.2s;
    }

    #alarm-time:focus {
      border-bottom-color: #7c3aed;
    }

    #toggle-btn {
      width: 100%;
      padding: 14px;
      border-radius: 14px;
      border: none;
      font-size: 16px;
      font-weight: 700;
      font-family: "Nunito", sans-serif;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
      background: linear-gradient(135deg, #a78bfa, #7c3aed);
      color: #fff;
      box-shadow: 0 4px 14px rgba(124, 58, 237, 0.35);
    }

    #toggle-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(124, 58, 237, 0.45);
    }

    #toggle-btn:active {
      transform: scale(0.97);
    }

    #toggle-btn.active {
      background: linear-gradient(135deg, #fb7185, #e11d48);
      box-shadow: 0 4px 14px rgba(225, 29, 72, 0.35);
    }

    #toggle-btn.active:hover {
      box-shadow: 0 6px 18px rgba(225, 29, 72, 0.45);
    }

    #status {
      font-size: 13px;
      font-weight: 600;
      color: #c4b5fd;
      height: 18px;
    }

    #status.set {
      color: #34d399;
    }

    #status.ringing {
      color: #f59e0b;
      animation: pulse 0.8s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    #dismiss-btn {
      display: none;
      width: 100%;
      padding: 14px;
      border-radius: 14px;
      border: 2.5px solid #fbbf24;
      background: #fffbeb;
      color: #d97706;
      font-size: 16px;
      font-weight: 700;
      font-family: "Nunito", sans-serif;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s;
    }

    #dismiss-btn:hover {
      background: #fef3c7;
      transform: translateY(-2px);
    }

    body.ringing {
      animation: flash 0.8s ease-in-out infinite;
    }

    @keyframes flash {
      0%, 100% { background: linear-gradient(135deg, #fce4ec 0%, #f3e5f5 50%, #e3f2fd 100%); }
      50% { background: linear-gradient(135deg, #fef9c3 0%, #fce4ec 50%, #fef3c7 100%); }
    }
  </style>
</head>
<body>
  <div class="emoji-top">⏰</div>
  <div id="clock">00:00:00</div>

  <div class="card">
    <h2>アラーム設定</h2>
    <input type="time" id="alarm-time" value="07:00" />
    <div id="status">未設定</div>
    <button id="toggle-btn">✨ セット</button>
    <button id="dismiss-btn">🔕 止める</button>
  </div>

  <script>
    const clockEl = document.getElementById("clock");
    const alarmInput = document.getElementById("alarm-time");
    const toggleBtn = document.getElementById("toggle-btn");
    const dismissBtn = document.getElementById("dismiss-btn");
    const statusEl = document.getElementById("status");

    let alarmActive = false;
    let ringing = false;
    let audioCtx = null;
    let alarmNodes = [];

    function pad(n) {
      return String(n).padStart(2, "0");
    }

    function tick() {
      const now = new Date();
      const hh = pad(now.getHours());
      const mm = pad(now.getMinutes());
      const ss = pad(now.getSeconds());
      clockEl.textContent = `${hh}:${mm}:${ss}`;

      if (alarmActive && !ringing) {
        const alarmVal = alarmInput.value;
        const currentHHMM = `${hh}:${mm}`;
        if (currentHHMM === alarmVal && now.getSeconds() === 0) {
          triggerAlarm();
        }
      }
    }

    function triggerAlarm() {
      ringing = true;
      document.body.classList.add("ringing");
      statusEl.textContent = "🔔 アラーム！";
      statusEl.className = "ringing";
      dismissBtn.style.display = "block";
      toggleBtn.style.display = "none";
      startAlarmSound();
    }

    function startAlarmSound() {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      playBeepLoop();
    }

    function playBeepLoop() {
      if (!ringing) return;
      const freqs = [880, 1100, 880, 1100];
      let time = audioCtx.currentTime;
      alarmNodes = [];
      freqs.forEach((freq, i) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.type = "sine";
        osc.frequency.value = freq;
        const start = time + i * 0.25;
        const end = start + 0.2;
        gain.gain.setValueAtTime(0, start);
        gain.gain.linearRampToValueAtTime(0.3, start + 0.01);
        gain.gain.linearRampToValueAtTime(0, end);
        osc.start(start);
        osc.stop(end);
        alarmNodes.push(osc);
      });
      setTimeout(() => { if (ringing) playBeepLoop(); }, 1200);
    }

    function stopAlarmSound() {
      alarmNodes.forEach(n => { try { n.stop(); } catch (_) {} });
      alarmNodes = [];
      if (audioCtx) {
        audioCtx.close();
        audioCtx = null;
      }
    }

    dismissBtn.addEventListener("click", () => {
      ringing = false;
      alarmActive = false;
      document.body.classList.remove("ringing");
      stopAlarmSound();
      dismissBtn.style.display = "none";
      toggleBtn.style.display = "block";
      toggleBtn.textContent = "✨ セット";
      toggleBtn.classList.remove("active");
      statusEl.textContent = "未設定";
      statusEl.className = "";
    });

    toggleBtn.addEventListener("click", () => {
      if (!alarmActive) {
        alarmActive = true;
        toggleBtn.textContent = "🔴 解除";
        toggleBtn.classList.add("active");
        statusEl.textContent = `${alarmInput.value} にアラーム設定済み`;
        statusEl.className = "set";
      } else {
        alarmActive = false;
        toggleBtn.textContent = "✨ セット";
        toggleBtn.classList.remove("active");
        statusEl.textContent = "未設定";
        statusEl.className = "";
      }
    });

    setInterval(tick, 1000);
    tick();
  </script>
</body>
</html>
